<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Wedding Games project preview</title>
  <desc id="desc">A stylized preview showing Connections, Wordle, and Strands game cards.</desc>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <rect x="70" y="70" width="1060" height="660" rx="38" fill="#ffffff" stroke="#d9e0ea" stroke-width="4"/>
  <text x="600" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#172033">Wedding Games</text>
  <text x="600" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#667085">Choose a game to play.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#172033">
    <rect x="145" y="325" width="260" height="210" rx="26" fill="#f1f5f9" stroke="#d9e0ea" stroke-width="3"/>
    <text x="275" y="420" text-anchor="middle" font-size="34">Connections</text>
    <text x="275" y="470" text-anchor="middle" font-size="22" fill="#2563eb">Play Connections</text>

    <rect x="470" y="325" width="260" height="210" rx="26" fill="#f1f5f9" stroke="#d9e0ea" stroke-width="3"/>
    <text x="600" y="420" text-anchor="middle" font-size="34">Wordle</text>
    <text x="600" y="470" text-anchor="middle" font-size="22" fill="#2563eb">Play Wordle</text>

    <rect x="795" y="325" width="260" height="210" rx="26" fill="#f1f5f9" stroke="#d9e0ea" stroke-width="3"/>
    <text x="925" y="420" text-anchor="middle" font-size="34">Strands</text>
    <text x="925" y="470" text-anchor="middle" font-size="22" fill="#2563eb">Play Strands</text>
  </g>
  <text x="600" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#667085">Next.js · TypeScript · Supabase · PostgreSQL · Playwright</text>
</svg>